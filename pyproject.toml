[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "easynews"
version = "0.1.0"
description = "A simple and lightweight Google News RSS search library for Python"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "feedparser"
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/EasyNews"